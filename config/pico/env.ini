[env:pico]
extends = arduino_pico_base
build_src_filter =
    ${arduino_pico_base.build_src_filter}
    +<config/pico>

; Same as pico, plus encoder state printed over USB serial (USB backends only, never on joybus).
; Not for console use.
[env:pico_encoder_debug]
extends = env:pico
build_flags =
    ${arduino_pico_base.build_flags}
    -D ENCODER_DEBUG
